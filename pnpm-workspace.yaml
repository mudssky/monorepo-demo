packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@alicloud/openapi-core': true
  '@automock/adapters.nestjs': true
  '@compodoc/compodoc': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  core-js-pure: true
  esbuild: true
  prisma: true
  protobufjs: true
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
  unrs-resolver: true
